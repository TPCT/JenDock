
# Apache virtual hosts for Shiftcodes v2 on the host that already serves v1.
#
# Install as /etc/apache2/sites-available/deploy.shiftcodes.net.conf, then (see
# docs/deployment.md): a2ensite, apachectl configtest, graceful reload. A NEW file: v1's
# monitoring.shiftcodes.net vhost and its includes are not edited.
# Modules: proxy proxy_http headers ssl rewrite.
#
# Adjust the two certificate paths to where the host's existing (Docker-based) certbot stores
# the certificate for deploy.shiftcodes.net; request it first with the shared HTTP-01 webroot
# that the port-80 vhost below serves (v1's layout: verify the real paths on the host).

<VirtualHost *:80>
    ServerName deploy.shiftcodes.net

    # ACME HTTP-01 challenges are answered from the shared webroot; everything else goes to https.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot/.well-known/acme-challenge/">
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://deploy.shiftcodes.net%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName deploy.shiftcodes.net

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/deploy.shiftcodes.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/deploy.shiftcodes.net/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"

    # The API sets its own security headers. Apache supplies the client address: mod_proxy adds
    # X-Forwarded-For (ProxyAddHeaders On is the default) and the platform trusts it only from
    # SHIFTCODES_TRUSTED_PROXIES (the compose network gateway). Anything the client sent is
    # replaced, never appended to.
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"

    # Run logs stream over server-sent events and /mcp answers can take a while: long timeout.
    ProxyPass        / http://127.0.0.1:8000/ connectiontimeout=5 timeout=3600
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog  ${APACHE_LOG_DIR}/deploy.shiftcodes.net-error.log
    CustomLog ${APACHE_LOG_DIR}/deploy.shiftcodes.net-access.log combined
</VirtualHost>

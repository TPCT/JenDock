# jendock-managed: host=app.example.com format=1
# Generated by the Jendock host helper. Manual edits are overwritten.

<VirtualHost *:80>
    ServerName app.example.com

    Alias /.well-known/acme-challenge/ "/var/lib/jendock/acme-webroot/.well-known/acme-challenge/"
    <Directory "/var/lib/jendock/acme-webroot/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://app.example.com/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName app.example.com

    SSLEngine on
    SSLCertificateFile "/etc/jendock/certs/app.example.com/fullchain.pem"
    SSLCertificateKeyFile "/etc/jendock/certs/app.example.com/privkey.pem"

    Header always setifempty Strict-Transport-Security "max-age=31536000"
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always setifempty X-Frame-Options "SAMEORIGIN"
    Header always setifempty Referrer-Policy "strict-origin-when-cross-origin"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader unset Proxy early
    RequestHeader set X-Forwarded-Proto "https"
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*)$ ws://127.0.0.1:20001/$1 [P,L]
    ProxyPass / http://127.0.0.1:20001/ retry=0
    ProxyPassReverse / http://127.0.0.1:20001/
</VirtualHost>

# shiftcodes-managed: host=app.example.com format=1
# Generated by the Shiftcodes host helper. Manual edits are overwritten.

<VirtualHost *:80>
    ServerName app.example.com

    Alias /.well-known/acme-challenge/ "/var/lib/shiftcodes/acme-webroot/.well-known/acme-challenge/"
    <Directory "/var/lib/shiftcodes/acme-webroot/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPass /.well-known/acme-challenge/ !
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader unset Proxy early
    RequestHeader set X-Forwarded-Proto "http"
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*)$ ws://127.0.0.1:20001/$1 [P,L]
    ProxyPass / http://127.0.0.1:20001/ retry=0
    ProxyPassReverse / http://127.0.0.1:20001/
</VirtualHost>

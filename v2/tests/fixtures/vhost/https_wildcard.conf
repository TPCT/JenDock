# shiftcodes-managed: host=*.example.com format=1
# Generated by the Shiftcodes host helper. Manual edits are overwritten.

<VirtualHost *:80>
    ServerName wildcard.example.com
    ServerAlias *.example.com

    Alias /.well-known/acme-challenge/ "/var/lib/shiftcodes/acme-webroot/.well-known/acme-challenge/"
    <Directory "/var/lib/shiftcodes/acme-webroot/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTP_HOST} ^([a-z0-9-]+(?:\.[a-z0-9-]+)*)\.example\.com(?::80)?$ [NC]
    RewriteRule ^/?(.*)$ https://%1.example.com/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName wildcard.example.com
    ServerAlias *.example.com

    SSLEngine on
    SSLCertificateFile "/etc/shiftcodes/certs/_wildcard_.example.com/fullchain.pem"
    SSLCertificateKeyFile "/etc/shiftcodes/certs/_wildcard_.example.com/privkey.pem"

    Header always setifempty Strict-Transport-Security "max-age=31536000"
    Header always setifempty X-Content-Type-Options "nosniff"
    Header always setifempty X-Frame-Options "SAMEORIGIN"
    Header always setifempty Referrer-Policy "strict-origin-when-cross-origin"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 120
    RequestHeader unset Proxy early
    RequestHeader set X-Forwarded-Proto "https"
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*)$ ws://127.0.0.1:20003/$1 [P,L]
    ProxyPass / http://127.0.0.1:20003/ retry=0
    ProxyPassReverse / http://127.0.0.1:20003/
</VirtualHost>

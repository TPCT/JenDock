[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftcodes"
version = "0.1.0"
description = "Self-hosted Jenkins-like CI/CD platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "psycopg[binary]>=3.2",
    # 1.2.x fails the first caching_sha2_password login of a non-root user (AttributeError).
    "PyMySQL>=1.1,<1.2",
    "httpx>=0.27",
    "idna>=3.7",
    "pyyaml>=6",
    "mcp==2.3.0",  # official MCP SDK (streamable HTTP server for agents, mounted at /mcp)
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["shiftcodes*"]

[tool.setuptools.package-data]
"shiftcodes.repositories.migrations" = ["script.py.mako"]
"shiftcodes.pipeline.templates" = ["*.Jenkinsfile"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "S", "PTH", "RET", "ARG", "C4", "PL",
]
ignore = [
    "PLR2004", # magic values are fine in small comparisons
    "S104",    # binding to 0.0.0.0 is configured explicitly in containers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002", "PLR0913", "PLR0917", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMySQL ships no type information (and no types-PyMySQL dependency is pinned).
module = ["pymysql", "pymysql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not docker'"
markers = [
    "docker: needs a local Docker daemon; run with `make test-docker` (skipped when unavailable)",
]

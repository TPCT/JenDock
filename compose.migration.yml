# Automatic migration execution. Use the same immutable image on both services.
# Reuse the existing database vault key; replacing it loses access to saved accounts.
services:
  receiver:
    environment:
      MIGRATION_HELPER_IMAGE: ${DEPLOY_MIGRATION_HELPER_IMAGE:?Set the loaded migration helper sha256 ID}
  worker:
    environment:
      MIGRATION_HELPER_IMAGE: ${DEPLOY_MIGRATION_HELPER_IMAGE:?Set the loaded migration helper sha256 ID}
      DATABASE_INSPECTION_KEY_FILE: /config/database-inspection.key
    volumes:
      - type: bind
        source: ${DEPLOY_DATABASE_INSPECTION_KEY_FILE:?Set the existing private database vault key file}
        target: /config/database-inspection.key
        read_only: true
        bind:
          create_host_path: false

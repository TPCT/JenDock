services:
  worker:
    environment:
      DATABASE_INSPECTION_KEY_FILE: /config/database-inspection.key
      DATABASE_INSPECTOR_IMAGE: ${DEPLOY_DATABASE_INSPECTOR_IMAGE:?Set the loaded inspector image sha256 ID}
    volumes:
      - type: bind
        source: ${DEPLOY_DATABASE_INSPECTION_KEY_FILE:?Set an existing private database inspection key file}
        target: /config/database-inspection.key
        read_only: true
        bind:
          create_host_path: false

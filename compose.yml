name: deploy-monitor
services:
  receiver:
    image: deploy-monitor-receiver:${DEPLOY_MONITOR_VERSION:?Set version}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    environment:
      PUBLIC_ORIGIN: https://monitoring.shiftcodes.net
      PROJECTS_FILE: /policy/projects.json
    volumes:
      - ./policy:/policy:ro
      - ./credentials.json:/config/credentials.json:ro
      - state:/state
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    ports: ["127.0.0.1:19190:8080"]
    networks: [dashboard]
    logging: {driver: local, options: {max-size: 5m, max-file: "2"}}
  worker:
    image: deploy-monitor-worker:${DEPLOY_MONITOR_VERSION:?Set version}
    restart: unless-stopped
    read_only: true
    user: "0:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import sqlite3,time; c=sqlite3.connect('/state/state.sqlite'); r=c.execute(\"SELECT updated FROM snapshots WHERE name='worker'\").fetchone(); assert r and time.time()-r[0]<60"]
      interval: 20s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      DOCKER_HOST: unix:///run/docker-isolation.sock
      PROJECTS_FILE: /policy/projects.json
      GIT_SSH_COMMAND: ssh -i /credentials/id_rsa -o Hostname=ssh.github.com -p 443 -o HostKeyAlias=github.com -o ConnectTimeout=10 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/credentials/known_hosts
    volumes:
      - ./policy:/policy:ro
      - ./git-credentials:/credentials:ro
      - /opt/docker-engine/29.8.2/docker/docker:/usr/local/bin/docker:ro
      - /opt/docker-engine/tools/docker-compose:/usr/local/bin/docker-compose:ro
      - /run/docker-isolation.sock:/run/docker-isolation.sock
      - /opt/docker-engine/projects:/opt/docker-engine/projects
      - state:/state
      - /proc/stat:/host/proc-stat:ro
      - /proc/meminfo:/host/proc-meminfo:ro
      - /proc/uptime:/host/proc-uptime:ro
      - /proc/loadavg:/host/proc-loadavg:ro
      - /proc/1/net/dev:/host/proc-net-dev:ro
      - worker-state:/worker-state
      - work:/work
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    networks: [egress]
    logging: {driver: local, options: {max-size: 5m, max-file: "2"}}
volumes:
  state: {external: true, name: deploy-monitor_state}
  worker-state: {external: true, name: deploy-monitor_worker-state}
  work: {external: true, name: deploy-monitor_work}
networks:
  dashboard: {}
  egress: {}

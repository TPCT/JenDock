name: jendock-v2

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      JENDOCK_ENVIRONMENT: production
      JENDOCK_DATA_DIR: /var/lib/jendock
      JENDOCK_WORKER_SOCKET_PATH: /run/jendock/worker.sock
      # Reverse proxies whose X-Forwarded-For is trusted for login rate limiting (IPs/CIDRs,
      # comma separated). Empty trusts nobody, so every client looks like the proxy and the
      # per-IP limit becomes a global one. Apache on the host reaches the published port via
      # the compose network gateway, e.g. TRUSTED_PROXIES=172.18.0.1 (docker network inspect).
      JENDOCK_TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      # Extra Host header values accepted at /mcp (DNS rebinding protection), comma separated.
      JENDOCK_MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-}"
    # api = uid 10002, worker = uid 10001, shared group 10001 (see the Dockerfiles): the socket
    # is 0660 in a setgid 2770 directory, so a compromised API cannot act as the worker user.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - data:/var/lib/jendock
      - worker-socket:/run/jendock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    # Deliberately no Docker socket: the API reaches Docker only through the worker socket.

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      JENDOCK_ENVIRONMENT: production
      JENDOCK_DATA_DIR: /var/lib/jendock
      JENDOCK_WORKER_SOCKET_PATH: /run/jendock/worker.sock
      JENDOCK_DOCKER_HOST: unix:///var/run/docker.sock  # in-container path, see volumes
      JENDOCK_DOCKER_BINARY: /usr/local/bin/docker
      # Containers started for `sh` steps mount the run workspace, and the host daemon resolves
      # bind mount paths on the host: that host directory is mounted below and named here.
      JENDOCK_WORKSPACE_HOST_DIR: "${WORKSPACES_HOST_DIR:-/var/lib/jendock-workspaces}"
      # Resource ceilings for step containers and builds (a pipeline may only lower them),
      # concurrent runs and the per-step log bound. See docs/execution.md.
      JENDOCK_CONTAINER_MEMORY: "${CONTAINER_MEMORY:-2g}"
      JENDOCK_CONTAINER_CPUS: "${CONTAINER_CPUS:-2}"
      JENDOCK_MAX_CONCURRENT_RUNS: "${MAX_CONCURRENT_RUNS:-1}"
      # The key lives in the worker-only `keys` volume; the API never sees it.
      JENDOCK_SECRET_KEY_FILE: /run/jendock-keys/secret.key
      # GitHub (docs/github.md): deploy keys for the ssh transport (one per repository in
      # /run/jendock-keys/deploy_keys, the default JENDOCK_GIT_SSH_KEY_DIR) and the webhook
      # secret, both files in the worker-only keys volume. Unset until you create them.
      JENDOCK_GITHUB_WEBHOOK_SECRET_FILE: /run/jendock-keys/github_webhook_secret
      JENDOCK_GITHUB_STATUS_ENABLED: "${GITHUB_STATUS_ENABLED:-false}"
    # Set DOCKER_GID to the host's docker group id (getent group docker).
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - data:/var/lib/jendock
      - worker-socket:/run/jendock
      - keys:/run/jendock-keys
      # Host directory (owned by uid 10001, mode 0750) that holds the run workspaces; the host
      # daemon mounts subdirectories of it into step containers. Set WORKSPACES_HOST_DIR to move it.
      - ${WORKSPACES_HOST_DIR:-/var/lib/jendock-workspaces}:/var/lib/jendock/workspaces
      # Host socket (set DOCKER_SOCKET_PATH if non-default) at a fixed in-container path.
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      # The compose CLI runs in this container but bind-mount sources are resolved by the host
      # daemon, and relative paths in compose files resolve against the compose file's own
      # directory: the host projects directory (compose files and --env-file files of deployed
      # environments) is mounted read-only at the IDENTICAL absolute path. The managed override
      # lives in the data volume, so nothing is written here. Set COMPOSE_PROJECTS_DIR to move it.
      - ${COMPOSE_PROJECTS_DIR:-/opt/docker-engine/projects}:${COMPOSE_PROJECTS_DIR:-/opt/docker-engine/projects}:ro
    restart: unless-stopped

  # Never started by `up`: the worker runs short-lived containers from this image to inspect an
  # environment's databases on that environment's own network. Build it once (and after
  # upgrades):  docker compose --profile tools build inspector
  inspector:
    # Built as jendock-v2-inspector:latest (compose project name + service), which is the
    # worker's JENDOCK_INSPECTOR_IMAGE default.
    build:
      context: .
      dockerfile: docker/inspector.Dockerfile
    profiles:
      - tools

volumes:
  data:
  worker-socket:
  keys:  # mounted in the worker only

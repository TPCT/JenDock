# Opt-in production packaging. Combine with compose.yml after worker/TLS acceptance.
# Reuse the existing integration key; never generate a replacement for encrypted data.
services:
  receiver:
    environment:
      INTEGRATION_KEY_FILE: /config/integrations.key
      MCP_PUBLIC_URL: https://monitoring.shiftcodes.net/_deploy/mcp
    volumes:
      - type: bind
        source: ${DEPLOY_INTEGRATION_KEY_FILE:?Set the existing private integration key path}
        target: /config/integrations.key
        read_only: true
        bind: {create_host_path: false}
  mcp:
    image: deploy-monitor-mcp:${DEPLOY_MONITOR_VERSION:?Set version}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      worker: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |-
          import os, urllib.request, urllib.error
          request = urllib.request.Request('http://127.0.0.1:8081/_deploy/mcp', data=b'{}', headers={'Host': os.environ['MCP_ALLOWED_HOSTS'].split(',')[0]})
          try:
              urllib.request.urlopen(request, timeout=2)
              raise SystemExit(1)
          except urllib.error.HTTPError as error:
              raise SystemExit(0 if error.code == 401 else 1)
      interval: 20s
      timeout: 3s
      start_period: 20s
      retries: 3
    environment:
      DEPLOY_DB: /state/state.sqlite
      DEPLOY_KEY_PATH: /config/integrations.key
      CREDENTIALS_FILE: /config/credentials.json
      MCP_ALLOWED_HOSTS: monitoring.shiftcodes.net
      MCP_ALLOWED_ORIGINS: https://monitoring.shiftcodes.net
      MCP_ENABLE_CREATION: "1"
      INGRESS_ENABLED: ${INGRESS_ENABLED:-0}
      INGRESS_ORIGIN_IPV4: ${INGRESS_ORIGIN_IPV4:-}
    volumes:
      - state:/state
      - type: bind
        source: ./credentials.json
        target: /config/credentials.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${DEPLOY_INTEGRATION_KEY_FILE:?Set the existing private integration key path}
        target: /config/integrations.key
        read_only: true
        bind: {create_host_path: false}
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    ports: ["127.0.0.1:19192:8081"]
    networks: [egress]
    logging: {driver: local, options: {max-size: 5m, max-file: "2"}}

# Production overlay for running Jendock on a VPS with an isolated Docker daemon (docs/deployment.md).
#
#   cd /opt/docker-engine/projects/jendock-v2        # a checkout of this release
#   cp deployment/env.production.example .env && chmod 0640 .env   # then edit it
#   docker-compose -f compose.yml -f deployment/compose.production.yml config   # review
#   docker-compose -f compose.yml -f deployment/compose.production.yml up -d
#
# It uses its own compose project (`jendock-v2`, set in compose.yml; the name is kept because
# the volumes and images of a running installation carry it), named volumes (`jendock-v2_*`)
# and a loopback port (127.0.0.1:8000). It talks to the host's isolated Docker daemon as a client.
#
# What this overlay adds to compose.yml:
#   * PUBLIC_ORIGIN (the public https origin; required);
#   * the host's pinned docker CLI, mounted
#     read-only (the worker deploys with `docker compose`, which finds the binary as a CLI
#     plugin);
#   * a backup directory for scheduled backups (off until BACKUP_ENABLED=true);
#   * hardening (dropped capabilities, no-new-privileges, memory/CPU/PID limits, log rotation,
#     a read-only root file system for the internet-facing API).
#
# Variables come from `.env` (deployment/env.production.example); none of them is a secret.
# Secrets (secret.key, deploy key, webhook secret) live only in the worker's `keys` volume.

services:
  api:
    environment:
      JENDOCK_PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://deploy.example.com}"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}

  worker:
    environment:
      JENDOCK_PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://deploy.example.com}"
      # The isolated daemon is reached through the socket mounted by compose.yml
      # (DOCKER_SOCKET_PATH=/run/docker-isolation.sock in .env); in the container it is always
      # /var/run/docker.sock. DOCKER_GID must be that socket's group id.
      # Image of the short-lived database-inspector helper containers (built in docs/deployment.md
      # section 7 with `--profile tools build inspector`); compose names it <project>-<service>.
      JENDOCK_INSPECTOR_IMAGE: "${INSPECTOR_IMAGE:-jendock-v2-inspector:latest}"
      JENDOCK_BACKUP_ENABLED: "${BACKUP_ENABLED:-false}"
      JENDOCK_BACKUP_DIR: /backups
      JENDOCK_BUILD_NETWORK: "${BUILD_NETWORK:-}"
      JENDOCK_BACKUP_KEEP: "${BACKUP_KEEP:-7}"
      JENDOCK_BACKUP_HOUR_UTC: "${BACKUP_HOUR_UTC:-3}"
    volumes:
      # The host's pinned CLI (29.8.2 at the time of writing); read-only, replaces the one in the image.
      - ${DOCKER_BINARY_HOST_PATH:-/opt/docker-engine/29.8.2/docker/docker}:/usr/local/bin/docker:ro
      # `docker compose` is the plugin shipped in the worker image (a standalone host binary may be
      # root-only, mode 0700, so the worker user could not execute it).
      # Host directory for scheduled backups, owned by uid 10001 (mode 0750).
      - ${BACKUP_HOST_DIR:-/var/backups/jendock}:/backups
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: local
      options: {max-size: 10m, max-file: "3"}
    # The worker's root file system is not read-only: git, ssh and `docker compose` write
    # under HOME (/var/lib/jendock, the data volume) and /tmp.

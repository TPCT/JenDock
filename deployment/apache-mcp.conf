# Include inside monitoring.shiftcodes.net's TLS VirtualHost, BEFORE ProxyPass /.
# Requires mod_proxy, mod_proxy_http and mod_headers. Do not include on other vhosts.
ProxyPass "/_deploy/mcp" "http://127.0.0.1:19192/_deploy/mcp" connectiontimeout=5 timeout=60
ProxyPassReverse "/_deploy/mcp" "http://127.0.0.1:19192/_deploy/mcp"
<Location "/_deploy/mcp">
    ProxyPreserveHost On
    ProxyAddHeaders Off
    RequestHeader unset Forwarded
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
</Location>
